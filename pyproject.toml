[project]
name = "default-redis"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
requires-python = "^3.14"
dependencies = [
    "fastapi (>=0.136.1,<0.137.0)",
    "pydantic-settings (>=2.14.0,<3.0.0)",
    "sqlalchemy (>=2.0.49,<3.0.0)",
    "uvicorn (>=0.46.0,<0.47.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "redis (>=7.4.0,<8.0.0)",
    "celery (>=5.6.3,<6.0.0)",
    "pytest (>=8.0.0)",
    "pytest-asyncio (>=0.24.0)",
    "pytest-cov (>=5.0.0)",
    "httpx (>=0.28.0)",
    "fakeredis (>=2.22.0)",
    "factory-boy (>=3.3.0)",
    "aiokafka (>=0.14.0,<0.15.0)",
]

[project.optional-dependencies]
performance = ["uvloop>=0.22.1"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.28.0",
    "fakeredis>=2.22.0",
    "factory-boy>=3.3.0",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "aiosqlite (>=0.22.1,<0.23.0)"
]